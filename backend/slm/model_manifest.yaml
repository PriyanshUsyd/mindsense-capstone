# Local SLM model manifest — pinned tag, per build-reference.md Section 6
# ("Pin the exact model tag ... Do not use a floating 'latest' tag in any
# release script") and skills/slm-ollama.md.
#
# STATUS: built to fill a Week 4 gap (no manifest existed in the repo as of
# 2026-08-29). Richard Zhao should confirm this matches what he actually
# pulled/tested locally.

provider: ollama
model_tag: "phi4-mini:3.8b"   # pinned exactly — never "phi4-mini:latest"
model_size_gb: 2.5
context_window_tokens: 131072  # 128K
license: MIT
call_pattern:
  mode: schema_constrained_json
  temperature: 0.0
notes: >
  All calls to this model go through backend/slm/client.py, the only file in
  the backend allowed to talk to the local Ollama daemon (bound to
  127.0.0.1 only — enforced by the Privacy lead's network-audit test, see
  docs/privacy/architecture-principles.md).
