# Deterministic answer to "what can you do?" (request policy 0.3.2, ME-P01
# F1). Not an SLM-generated explanation: no participant data is loaded and no
# model is called for this route.

template_id: capability
template_version: "1.3.0"
response_mode: refusal
allowed_claim_ids:
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  MindSense is an automated study tool, not a person, and it is not a
  substitute for a GP, doctor or mental-health professional. I can explain
  two tracked patterns from your phone: GPS distance travelled
  and phone unlock count. For each one I can describe what was observed in
  the recent observation window and, when there is enough history and the
  statistical evidence is strong enough, how it compares with your own
  baseline. I can't diagnose conditions, explain
  what caused a change, or give treatment advice. Try asking, for example,
  "How has my phone-unlock activity changed recently?"
  If you need support, you can speak with a GP or mental-health professional. In Australia, call Lifeline on 13 11 14; if you or someone else is in immediate danger, call Triple Zero (000).

review_note: >
  Added 2026-10-10 after ME-P01 on rc-eval-1, where "What can you help me
  with?" received the off-topic refusal. Wording approved by the
  Integration/QA lead for rc-eval-2; retain normal Evaluation and UI review. 1.3.0 (2026-10-24, policy 0.5.1):
  opening sentence added so questions about what MindSense is, or using it
  instead of a GP, are told it is not a person and not a substitute for a GP.
