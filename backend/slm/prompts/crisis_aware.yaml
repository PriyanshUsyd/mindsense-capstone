# Crisis-aware fallback template — the second of the two Week 4 required
# fallback templates (build-reference.md Section 6, skills/slm-ollama.md).
#
# CRITICAL: crisis wording is NEVER generated by the model. This exact,
# pre-approved text is returned verbatim by a rule-based detector (built
# jointly with the Evaluation lead, skills/evaluation-safety.md) — this file
# IS the deterministic crisis message, not a prompt fed to the SLM.
#
# STATUS: DRAFT built to fill a Week 4 gap on 2026-08-29. The helpline
# content below uses real, publicly-known crisis resources as a starting
# point, but per build-reference.md's own instruction ("real, reviewed
# helpline/support-resource content") this MUST be reviewed — ideally with
# the client (Tianyi) and/or a university counselling/health & safety
# contact — before this is ever shown to a real participant. Do not treat
# this draft as "reviewed."

template_id: crisis_aware_fallback
template_version: "1.0.0"
response_mode: crisis_aware_fallback
allowed_claim_ids:
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  It sounds like you might be going through something serious right now.
  I'm not able to help with that directly — I'm only built to describe
  patterns in tracked behaviour data, not to give crisis support or medical
  advice. If you are in immediate danger, please contact your local
  emergency number right away.

  If you're in the US: call or text 988 (Suicide & Crisis Lifeline), or
  text HOME to 741741 (Crisis Text Line).
  If you're in Australia: call Lifeline on 13 11 14.
  If you're elsewhere: please reach out to a local crisis line, campus
  counselling service, or a trusted person as soon as you can.

  This message is shown automatically whenever certain phrases are
  detected — it is not a judgment about your situation, just a safety
  default.

review_note: >
  NEEDS REAL REVIEW BEFORE USE WITH PARTICIPANTS. Resource list is
  US/Australia-centric as a draft starting point only — confirm which
  region(s) the actual pilot/evaluation participants are in (likely
  university-affiliated, given CES's Dartmouth origin and this being a
  student capstone) and swap in the correct local + campus resources.
  Flagged explicitly to Priyansh/Richard/Chonghao — this is exactly the
  kind of content build-reference.md says must be "real, reviewed," not
  AI-drafted-and-shipped as-is.
