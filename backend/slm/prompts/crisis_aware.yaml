# AUSTRALIA-SPECIFIC DRAFT. Resource details were checked on 2026-08-30
# against Lifeline Australia and Suicide Call Back Service official pages.
# Human/client and study-safety approval is still required before any real
# participant interaction (Week 7 pilot at the latest).
#
# Crisis-aware fallback template — the second of the two Week 4 required
# fallback templates (build-reference.md Section 6, skills/slm-ollama.md).
#
# CRITICAL: crisis wording is NEVER generated by the model. This exact,
# versioned text must be returned verbatim by a rule-based detector. That
# routing detector is a joint SLM/Evaluation task and is not part of the
# Week 4 template-design requirement. This file is the deterministic crisis
# message, not a prompt fed to the SLM.
#
# STATUS: RESOURCE-VERIFIED DRAFT, NOT PARTICIPANT-APPROVED. The official
# details below are real and Australia-specific, but the full wording and
# study response protocol still require review by the client and Evaluation
# lead, plus the applicable University of Sydney ethics/safety process.

template_id: crisis_aware_fallback
template_version: "1.1.0"
response_mode: crisis_aware_fallback
allowed_claim_ids:
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  It sounds like you may be going through something serious right now.
  MindSense cannot provide crisis support, medical advice, or a diagnosis.
  If you or someone else is in immediate danger in Australia, call Triple
  Zero (000) now. For free, confidential crisis support available 24 hours
  a day, 7 days a week in Australia, call Lifeline on 13 11 14, text
  0477 13 11 14, or use online chat at lifeline.org.au. You can also call
  Suicide Call Back Service on 1300 659 467 for free 24/7 phone counselling.
  This message is shown automatically when certain words are detected. It
  is a safety default, not a diagnosis or assessment of your situation.

review_note: >
  AUSTRALIA-SPECIFIC RESOURCE-VERIFIED DRAFT; NOT APPROVED FOR PARTICIPANT
  USE. Details checked on 2026-08-30 against https://www.lifeline.org.au/
  get-help/national-services/lifeline-crisis-support and
  https://www.suicidecallbackservice.org.au/. The client and Evaluation
  lead must approve the complete wording and facilitator escalation flow,
  and the team must add the correct University of Sydney support pathway
  if required by the study protocol, before the Week 7 pilot.
