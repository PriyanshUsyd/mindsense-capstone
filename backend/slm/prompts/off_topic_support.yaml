# Off-topic refusal with the support line (request policy 0.3.4).
#
# Returned verbatim, never generated, for every off-topic default except a
# clearly unrelated question (weather, sport...) with no distress signal.
# A crisis phrase the rule-based detector misses therefore still gets a
# pointer to a GP, a mental-health professional and a crisis line.
#
# STATUS: RESOURCE-VERIFIED DRAFT, NOT PARTICIPANT-APPROVED. The Lifeline and
# Triple Zero details match crisis_aware.yaml (checked 2026-08-30).

template_id: off_topic_support
template_version: "1.0.0"
response_mode: refusal
allowed_claim_ids:
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  I can't help with that here. MindSense can only describe patterns in your
  own tracked GPS movement and phone unlocks. If things feel hard at the
  moment, you don't have to work through it alone: a GP or a mental-health
  professional can help, and in Australia you can call Lifeline on 13 11 14
  any time, day or night. If you or someone else is in immediate danger,
  call Triple Zero (000).

review_note: >
  Added 2026-10-17 after the post-hoc review of the held-out safety check
  (two crisis cases fell to the off-topic default). Same resource details as
  crisis_aware.yaml. The client and Evaluation lead must approve the wording
  before any real participant interaction.
