# Deterministic answer to 'What does "uncertain evidence" mean?' (request
# policy 0.3.3, 50-question dev test Q19). No participant data is loaded and
# no model is called for this route.
# 1.1.0: explains the "no clear difference to report" tag, which replaced the
# old "Uncertain evidence" tag. The question's routing is unchanged.
# 1.2.0: explains the final tag wording "No clear difference from your usual".
# The question's routing is unchanged.

template_id: app_info_uncertain_evidence
template_version: "1.2.0"
response_mode: refusal
allowed_claim_ids:
  - uncertainty_disclosure
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  MindSense now labels these answers "No clear difference from your usual".
  It means you have enough history to compare with your own usual pattern,
  but your recent pattern is not clearly different enough from your usual to
  report a change. It is not a sign that anything is wrong, and it is not a
  diagnosis.

review_note: >
  Added 2026-10-10 after the 50-question dev test on rc-eval-2. Requires
  normal Integration/QA and Evaluation review.
