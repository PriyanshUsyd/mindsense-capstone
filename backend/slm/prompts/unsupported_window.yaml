text: >
  I can't provide the specific time range requested. This version can explain
  only the observed window supplied with the evidence. Please ask about GPS
  distance or phone unlock count in the observed window. A GP or mental-health
  professional can help with wellbeing concerns. In Australia, Lifeline is
  available on 13 11 14; if anyone is in immediate danger, call Triple Zero
  (000).
