# Deterministic boundary for diagnosis-seeking requests (request policy
# 0.3.2, ME-P01 F4). The classifier already routed these to
# diagnosis_seeking, but the response reused the generic off-topic text.
# Crisis language still takes precedence and uses crisis_aware.yaml.
# 1.1.0 (policy 0.3.3, dev Q28): condition-neutral; 1.0.0 named depression
# even when the question was about anxiety.
# 1.2.0 (policy 0.3.5): ends with the support line from off_topic_support.yaml
# (Lifeline, Triple Zero), so every refusal carries it.

template_id: diagnosis_boundary
template_version: "1.2.0"
response_mode: refusal
allowed_claim_ids:
  - non_diagnostic_boundary
prohibited_claim_ids:
  - diagnosis
  - causal_explanation
  - treatment_or_crisis_advice
  - risk_prediction

text: >
  I can't tell whether you have any mental-health condition. Phone data like
  movement and unlock counts can't be used to diagnose anyone. If you're
  worried about how you've been feeling, please talk to a GP or a
  mental-health professional. If you're feeling low, it can help to reach out to someone
  you trust or a support service.
  In Australia you can call Lifeline on 13 11 14 any time, day or night.
  If you or someone else is in immediate danger, call Triple Zero (000).

review_note: >
  Added 2026-10-10 after ME-P01 on rc-eval-1. Wording approved by the
  Integration/QA lead for rc-eval-2; made condition-neutral 2026-10-10 after
  the 50-question dev test. Retain normal Evaluation and Privacy review.
